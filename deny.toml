# Supply-chain policy for both independent Rust crates.
# Run from platform/ or eval/ with an explicit config:
#   cargo deny --config ..\deny.toml check
# The CI security job installs cargo-deny and runs the same command.
#
# This policy is deliberately narrow: it permits the permissive licenses used by
# the current dependency graph and denies unknown registries, wildcard versions,
# and yanked crates. Adding a new license or source requires a reviewed change.

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
unused-ignored-advisory = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "warn"
# The two workspace crates are unpublished and their license decision is still
# pending. This only skips those workspace members; every third-party crate is
# still checked against the allow-list below.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
