[package]
name = "ekp_eval"
version = "0.1.0"
edition = "2021"
publish = false
description = "EKPI ablation evaluation harness (normative implementation)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep this crate independent even if an unrelated Cargo manifest exists in a
