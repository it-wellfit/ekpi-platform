name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: bash scripts/check.sh
          - os: windows-latest
            command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run repository checks
        run: ${{ matrix.command }}

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: High-signal secret pattern scan
        run: bash scripts/check-secrets.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit platform lockfile
        working-directory: platform
        run: cargo audit

      - name: Audit eval lockfile
        working-directory: eval
        run: cargo audit

# Notes:
# - The validate matrix calls the same fixed entry point contributors run locally;
#   the commands are not duplicated in the workflow.
# - Smoke/report/export artifacts are part of gate.ps1 -IncludeSmoke and are required
#   locally for changes that affect reports, exports, coverage, HTML or data. CI does
#   not yet run a separate smoke job; do not claim CI proved those artifacts.
# - Actions are tag-pinned. Pin by SHA when the security policy requires it.
