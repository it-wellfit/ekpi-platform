name: Feature request
description: Propose a specific, testable change. For a detailed spec, use docs/development/spec-template.md.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Business or user problem
      description: Who encounters the problem, in what situation, and what happens today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing an unvalidated implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List verifiable outcomes, including refusal, error, or empty states where relevant.
      placeholder: |
        - Given ...
        - When ...
        - Then ...
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Requirement and source links
      description: Link requirement IDs, governance specifications, user research, or authoritative evidence.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Initial risk tier
      options:
        - Low
        - Medium
        - High
        - Unknown
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and unresolved decisions
      description: Include compatibility, security, accessibility, data, and rollout constraints. Assign an owner to each unresolved decision.
    validations:
      required: true
