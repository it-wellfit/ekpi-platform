name: Bug report
description: Report a reproducible defect or regression.
title: "[Bug]: "
body:
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence and any safe test data.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: User and business impact
      description: Include affected roles, frequency, severity, and any workaround.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include commit/version, OS, relevant logs, and screenshots. Redact credentials and personal data.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Initial risk tier
      options:
        - Low
        - Medium
        - High
        - Unknown
    validations:
      required: true
