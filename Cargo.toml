[workspace]
members = [
    "apps/web",
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "eval",
    "platform",
]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Proprietary"

[workspace.dependencies]
# Web framework
axum = { version = "0.8.9", features = ["form"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

# Middleware
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "limit", "compression-gzip", "compression-br", "fs"] }

# HTML Template
askama = "0.16.1"

# Database
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "uuid", "chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# Error handling
thiserror = "2"
anyhow = "1"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Password security
argon2 = { version = "0.6", features = ["rand_core"] }

# Async trait objects (dyn compatible)
async-trait = "0.1"

# Hashing
sha2 = "0.10"
pbkdf2 = { version = "0.11", default-features = false }
hmac = "0.12"
getrandom = "0.2"
subtle = "2"

# Config
toml = "0.8"

# Eval dependency
ekp_eval = { path = "eval", version = "0.1.0" }