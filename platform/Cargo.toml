[package]
name = "ekp_platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "EKPI deterministic core: versioned docs, active-rule layer, process token replay, evidence retrieval, decision snapshots"

[dependencies]
axum = { workspace = true }
maud = "0.27.0"
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
pbkdf2 = { workspace = true }
hmac = { workspace = true }
getrandom = { workspace = true }
subtle = { workspace = true }
toml = { workspace = true }
ekp_eval = { workspace = true }
ekp_domain = { path = "../crates/domain", version = "0.1.0" }
ekp_adapters = { path = "../crates/adapters", version = "0.1.0" }
tokio = { workspace = true }

[[bin]]
name = "ekp_platform"
test = false

[[bin]]
name = "governance_web"
path = "src/bin/governance_web.rs"
test = false

[dev-dependencies]
http-body-util = "0.1.3"
tower = { workspace = true }
proptest = "1.0"